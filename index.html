<!-- v9.2_PRO: single corrected build with Samsung/iPhone compact payload and 13% logo -->
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QR-kode Generator — v9.2 PRO</title>
<style>
  body{font-family:Arial,monospace;background:#f9fafb;margin:0;padding:18px;color:#111827;}
  h1{font-size:24px;margin-bottom:6px;}
  .wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 420px;gap:18px;align-items:start;}
  .card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.06);}
  label{display:block;margin-top:10px;font-weight:700;font-size:15px;}
  input,select,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid #e6e9ef;font-size:14px;font-family:Arial,monospace;box-sizing:border-box;}
  textarea{resize:vertical;}
  .row{display:flex;gap:8px;align-items:center;}
  .row .flex1{flex:1;}
  .row .w90{width:90px;}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  button{padding:10px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:600;}
  .btn-primary{background:#111827;color:#fff;}
  .btn-ghost{background:#eef2ff;color:#111827;}
  .muted{font-size:13px;color:#6b7280;margin-top:8px;}
  #preview{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:380px;justify-content:center;}
  #preview canvas{max-width:100%;height:auto;border-radius:8px;background:#fff;padding:8px;border:1px solid #e6e9ef;}
  .note{font-size:12px;color:#6b7280;margin-top:8px;}
  .version{font-size:12px;color:#6b7280;text-align:center;margin-top:14px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>QR-kode Generator — v9.2 PRO</h1>
    <div class="muted">Alle skabeloner + ubeskadiget sort/hvid ROCKWOOL-logo indlejret (13% bredde, korrekt aspect ratio).</div>

    <label for="template">Skabelon</label>
    <select id="template">
      <option value="lager" selected>Lager</option>
      <option value="custom">Fri tekst / URL</option>
      <option value="wifi">Wi-Fi</option>
      <option value="vcard">vCard</option>
      <option value="sms">SMS</option>
      <option value="varenummer">Varenummer</option>
      <option value="bestilling">Bestilling</option>
    </select>

    <div id="templateFields" style="margin-top:8px"></div>

    <label for="overlay">Overlay-tekst (vises under QR kun hvis udfyldt)</label>
    <input id="overlay" placeholder="Fx: SCAN ME" type="text"/>

    <div class="controls">
      <button class="btn-primary" id="btnGenerate">Generér</button>
      <button class="btn-ghost" id="btnUpdate">Opdater</button>
      <button class="btn-ghost" id="btnDownload">Download</button>
      <button class="btn-ghost" id="btnCopy">Kopiér</button>
      <button class="btn-ghost" id="btnReset">Nulstil</button>
    </div>

    <div class="version">Version 9.1 PRO - Samsung+iPhone kompatibel</div>
  </div>

  <div class="card">
    <div id="preview"><div class="note">Udfyld felter og tryk <strong>Generér</strong>.</div></div>
  </div>
</div>

document.addEventListener('DOMContentLoaded', ()=>{
  const templateSelect = document.getElementById('template');
  const templateFields = document.getElementById('templateFields');
  const preview = document.getElementById('preview');
  const overlayInput = document.getElementById('overlay');
  const btnGenerate = document.getElementById('btnGenerate');
  const btnUpdate = document.getElementById('btnUpdate');
  const btnDownload = document.getElementById('btnDownload');
  const btnCopy = document.getElementById('btnCopy');
  const btnReset = document.getElementById('btnReset');

  const logo = new Image();
  logo.src = logoBase64;

  function buildLager(){
    templateFields.innerHTML = `
      <label>1) Område</label><input id="lagerOmr" type="text" placeholder="Område">
      <label>2) Varenummer</label><input id="lagerVnr" type="text" placeholder="Varenummer">
      <label>3) Materiale</label><input id="lagerMat" type="text" placeholder="Materiale">
      <label>3,1) Materiale info</label><input id="lagerOperatoer" type="text" placeholder="Materiale">
      <label>4) Antal</label>
      <div class="row">
        <input id="lagerAntal" class="flex1" type="text" placeholder="Antal">
        <select id="lagerEnhed" class="w90">
          <option value="">Enhed</option><option value="PL">PL</option><option value="RULL">RULL</option><option value="KS">KS</option><option value="ST">ST</option><option value="FL">FL</option><option value="DUNK">DUNK</option>
        </select>
        <select id="lagerIPaa" class="w90"><option value="">PL / KS</option><option value="KS">KS</option><option value="PL">PL</option></select>
      </div>

      <label>5) Mål (mm / kg)</label>
      <div class="row">
        <input id="lagerL" type="text" placeholder="L (mm)">
        <input id="lagerB" type="text" placeholder="B (mm)">
        <input id="lagerT" type="text" placeholder="T (my)">
        <input id="lagerV" type="text" placeholder="V (kg)">
      </div>

      <label>6) Meter & Areal</label>
      <div class="row"><input id="lagerM" type="text" placeholder="Meter (M)"><input id="lagerM2" type="text" placeholder="Areal (m²)"></div>

      <label>7) Anden info</label><textarea id="lagerInfo" rows="3" placeholder="Anden info"></textarea>

      <label>8) Lagerplads</label>
      <div class="row"><input id="lagerOmraade" type="text" placeholder="Lager/Område"><input id="lagerReol" type="text" placeholder="Reol"><input id="lagerHylde" type="text" placeholder="Hylde"><input id="lagerPlads" type="text" placeholder="Plads"></div>

      <label>9) Kemi</label><input id="lagerKemi" type="text" placeholder="UN-nummer (fx 1209)">
    `;
  }

  function buildCustom(){ templateFields.innerHTML = '<label>Tekst / URL</label><textarea id="customText" rows="4"></textarea>'; }
  function buildWifi(){ templateFields.innerHTML = '<label>SSID</label><input id="wifiSsid" type="text"><label>Password</label><input id="wifiPass" type="text"><label>Kryptering</label><select id="wifiType"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">Ingen</option></select>'; }
  function buildVcard(){ templateFields.innerHTML = '<label>Navn</label><input id="vName" type="text"><label>Telefon</label><input id="vTel" type="text"><label>Email</label><input id="vEmail" type="text">'; }
  function buildSms(){ templateFields.innerHTML = '<label>Telefonnummer</label><input id="smsNum" type="text"><label>Besked</label><textarea id="smsMsg" rows="4"></textarea>'; }
  function buildVarenr(){ templateFields.innerHTML = '<label>Materiale-nummer</label><input id="vareNr" type="text">'; }
  function buildBestil(){ templateFields.innerHTML = '<label>Varenummer</label><input id="bestilNr" type="text"><label>Beskrivelse</label><textarea id="bestilBeskrivelse" rows="3"></textarea>'; }

  function renderTemplateFields(){
    const t = templateSelect.value;
    if(t === 'lager') buildLager();
    else if(t === 'custom') buildCustom();
    else if(t === 'wifi') buildWifi();
    else if(t === 'vcard') buildVcard();
    else if(t === 'sms') buildSms();
    else if(t === 'varenummer') buildVarenr();
    else if(t === 'bestilling') buildBestil();
  }

  function getQRText(){
    const t = templateSelect.value;
    if(t === 'lager'){
      const f = id=>document.getElementById(id)?.value.trim()||'';
      const omr=f('lagerOmr'),vnr=f('lagerVnr'),mat=f('lagerMat'),
            antal=f('lagerAntal'),enhed=f('lagerEnhed'),ipaa=f('lagerIPaa'),
            L=f('lagerL'),B=f('lagerB'),T=f('lagerT'),V=f('lagerV'),
            M=f('lagerM'),M2=f('lagerM2'),info=f('lagerInfo'),
            omraade=f('lagerOmraade'),
            reol=f('lagerReol'),hylde=f('lagerHylde'),plads=f('lagerPlads'),
            kemi=f('lagerKemi'),
            oper=f('lagerOperatoer');
      const parts=[];
      if(omr) parts.push(`O:${omr}`);
      if(vnr) parts.push(`VN:${vnr}`);
      if(mat) parts.push(`MA:${mat}`);
      if(oper) parts.push(`MI:${oper}`);
      if(antal){
        let aval = antal;
        if(enhed) aval += enhed;
        if(ipaa==='KS') aval += '/KS';
        else if(ipaa==='PL') aval += '/PL';
        parts.push(`A:${aval}`);
      }
      if(L) parts.push(`L:${L}`);
      if(B) parts.push(`B:${B}`);
      if(T) parts.push(`T:${T}`);
      if(V) parts.push(`V:${V}`);
      if(M) parts.push(`M:${M}`);
      if(M2) parts.push(`A2:${M2}`);
      if(info) parts.push(`AI:${info}`);
      if(omraade) parts.push(`LO:${omraade}`);
      if(reol) parts.push(`RE:${reol}`);
      if(hylde) parts.push(`HY:${hylde}`);
      if(plads) parts.push(`PL:${plads}`);
      if(kemi) parts.push(`KE:${kemi.replace(/^UN/i,'')}`);
      return parts.join('|');
    }
    if(t === 'custom') return document.getElementById('customText').value||'';
    if(t === 'wifi') return `WIFI:T:${document.getElementById('wifiType').value||'WPA'};S:${document.getElementById('wifiSsid').value||''};P:${document.getElementById('wifiPass').value||''};;`;
    if(t === 'vcard') return `BEGIN:VCARD
VERSION:3.0
FN:${document.getElementById('vName').value||''}
TEL:${document.getElementById('vTel').value||''}
EMAIL:${document.getElementById('vEmail').value||''}
END:VCARD`;
    if(t === 'sms') return `SMSTO:${document.getElementById('smsNum').value||''}:${document.getElementById('smsMsg').value||''}`;
    if(t === 'varenummer') return document.getElementById('vareNr').value||'';
    if(t === 'bestilling') return `VN:${document.getElementById('bestilNr').value||''}|BE:${document.getElementById('bestilBeskrivelse').value||''}`;
    return '';
  }

  async function generateQR(){
    try{
      const content = getQRText();
      preview.innerHTML = '';
      if(!content.trim()){
        preview.innerHTML = '<div class="note">Udfyld felter for at generere QR.</div>';
        return;
      }

      const canvas = document.createElement('canvas');
      await QRCode.toCanvas(canvas, content, {
        width: 420,
        margin: 2,
        errorCorrectionLevel: 'M',
        color: { dark: '#000000', light: '#ffffff' }
      });

      await new Promise((resolve,reject)=>{
        if(logo.complete && logo.naturalWidth!==0) resolve();
        else {
          logo.onload = ()=>resolve();
          logo.onerror = ()=>reject(new Error('Logo kunne ikke indlæses'));
        }
      });

      const ctx = canvas.getContext('2d');
      const size = canvas.width;

      const naturalW = logo.naturalWidth || 1;
      const naturalH = logo.naturalHeight || 1;
      const ratio = naturalH / naturalW;

      const logoW = Math.floor(size * 0.13);
      const logoH = Math.max(1, Math.floor(logoW * ratio));

      const x = Math.floor((size - logoW) / 2);
      const y = Math.floor((size - logoH) / 2);

      const pad = Math.ceil(Math.max(logoW, logoH) * 0.10);
      const bgW = logoW + pad * 2;
      const bgH = logoH + pad * 2;
      const bx = x - pad;
      const by = y - pad;

      ctx.fillStyle = '#ffffff';
      const r = Math.ceil(Math.max(bgW, bgH) * 0.06);
      ctx.beginPath();
      ctx.moveTo(bx + r, by);
      ctx.lineTo(bx + bgW - r, by);
      ctx.quadraticCurveTo(bx + bgW, by, bx + bgW, by + r);
      ctx.lineTo(bx + bgW, by + bgH - r);
      ctx.quadraticCurveTo(bx + bgW, by + bgH, bx + bgW - r, by + bgH);
      ctx.lineTo(bx + r, by + bgH);
      ctx.quadraticCurveTo(bx, by + bgH, bx, by + bgH - r);
      ctx.lineTo(bx, by + r);
      ctx.quadraticCurveTo(bx, by, bx + r, by);
      ctx.closePath();
      ctx.fill();

      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(logo, x, y, logoW, logoH);

      preview.appendChild(canvas);

      const ov = overlayInput.value.trim();
      if(ov){
        const p = document.createElement('div');
        p.style.fontWeight='700';
        p.style.marginTop='6px';
        p.style.fontSize='16px';
        p.textContent = ov;
        preview.appendChild(p);
      }

    }catch(err){
      preview.innerHTML = '<div class="note" style="color:red;">Fejl: ' + (err.message || err) + '</div>';
      console.error(err);
    }
  }

  function downloadQR(){
    const c = preview.querySelector('canvas');
    if(!c) return alert('Generér først QR-koden.');
    const a = document.createElement('a');
    a.href = c.toDataURL();
    a.download = 'qr_v9_2_PRO.png';
    a.click();
  }

  async function copyQR(){
    const c = preview.querySelector('canvas');
    if(!c) return alert('Generér først QR-koden.');
    c.toBlob(async (blob)=>{
      try{
        await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
        alert('QR-kode kopieret.');
      }catch(e){
        alert('Kopi mislykkedes: ' + (e && e.message ? e.message : e));
      }
    });
  }

  function resetFields(){
    templateFields.querySelectorAll('input, select, textarea').forEach(f=>f.value='');
    overlayInput.value='';
    preview.innerHTML='';
  }

  templateSelect.addEventListener('change', renderTemplateFields);
  btnGenerate.addEventListener('click', generateQR);
  btnUpdate.addEventListener('click', generateQR);
  btnDownload.addEventListener('click', downloadQR);
  btnCopy.addEventListener('click', copyQR);
  btnReset.addEventListener('click', resetFields);

  renderTemplateFields();
});
</script>
</body>
</html>
